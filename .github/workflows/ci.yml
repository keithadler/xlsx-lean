name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
      - name: The example file
        run: lake exe xlsxlean write out/example.xlsx
      - name: The adversarial corpus (fails if any spec verdict is not the expected one)
        run: lake exe xlsxlean lab out/lab 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Four readers on the corpus
        run: |
          pip install openpyxl==3.1.5 python-calamine==0.4.0
          mkdir -p /tmp/sheetjs && npm install --prefix /tmp/sheetjs xlsx@0.18.5
          python tools/differential.py out/lab --sheetjs /tmp/sheetjs/node_modules --json out/lab/results.json
      - name: Real files, from calamine's test suite (pinned)
        run: |
          mkdir -p /tmp/calamine && cd /tmp/calamine && git init -q
          git fetch -q --depth 1 https://github.com/tafia/calamine 0af05f4f6030351e3b8a999ea0810c8618368776
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          lake exe xlsxlean check --json /tmp/calamine/tests/*.xlsx > out/calamine.json || true
          python tools/summarize_checks.py out/calamine.json --expect-files 66 --expect-unreadable 2 --expect-pass 62
      - name: Real files, from Apache POI's test data (pinned)
        run: |
          mkdir -p /tmp/poi && cd /tmp/poi && git init -q
          git sparse-checkout set --no-cone test-data/spreadsheet/
          git fetch -q --depth 1 --filter=blob:none https://github.com/apache/poi 942d95d85b15d0dfdb3bc9ba1b4f273f277757c8
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          .lake/build/bin/xlsxlean check --json /tmp/poi/test-data/spreadsheet/*.xlsx > out/poi.json || true
          python tools/summarize_checks.py out/poi.json --expect-files 352 --expect-unreadable 19 --expect-pass 316
      - name: Fuzz the reader (every broken file gets an answer, and the report agrees with the checkers)
        run: |
          mkdir -p out/fuzz/seeds && cp out/lab/G2*.xlsx out/lab/F1*.xlsx out/fuzz/seeds/
          python tools/fuzz_reader.py out/fuzz/seeds --n 1500 --seed 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlsx
          path: |
            out/example.xlsx
            out/lab/results.json
            out/fuzz/failures/
